<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#faf9f6">
  <title>合映 · 和朋友一起修合照</title>
  <meta name="description" content="上传一张合照，朋友轮流用醒图修好自己。原片和每次回传的版本都能保存。">
  <link rel="icon" href="/icon.svg?v=2">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header>
    <div class="bar">
      <a href="#" class="brand" aria-label="合映首页">
        <img src="/icon.svg?v=2" width="33" height="33" alt="">
        <span>合映</span><small lang="zh-Latn">HÉYǏNG</small>
      </a>
      <nav aria-label="主导航">
        <a href="#" id="navHome">接力台</a>
        <a href="#recent" id="navRecent">最近接力</a>
        <button type="button" class="help" data-do="guide">使用指南</button>
      </nav>
    </div>
  </header>
  <main id="home">
    <section class="intro" aria-labelledby="coverTitle">
      <h1 id="coverTitle">合照接力</h1>
      <div class="start">
        <p>上传原片，和朋友轮流修图。<br>修好一版，就传给下一位。</p>
        <button type="button" class="primary" data-do="create"><i data-icon="plus"></i>发起接力</button>
      </div>
    </section>
    <div class="spread">
      <figure class="cover">
        <img src="/coast.jpg" alt="三个朋友在海边拥着彼此大笑" fetchpriority="high">
        <figcaption>
          <span class="caption-title">海边的我们 <small>示例合照</small></span>
          <button type="button" class="text-action" data-do="demo">用这张试试</button>
        </figcaption>
      </figure>
      <section class="recent" id="recent" aria-labelledby="recentTitle">
        <div class="sectionhead">
          <h2 id="recentTitle">最近接力</h2>
          <span>此设备</span>
        </div>
        <div id="recentList"></div>
      </section>
    </div>
  </main>
  <main id="room" hidden></main>
  <dialog id="modal" aria-labelledby="dialogTitle">
    <div class="dialoghead">
      <h2 id="dialogTitle"></h2>
      <button type="button" class="iconbtn" aria-label="关闭" id="closeModal"><i data-icon="close"></i></button>
    </div>
    <div id="dialogBody"></div>
  </dialog>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
</body>
</html>
